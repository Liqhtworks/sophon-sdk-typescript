name: TypeScript SDK CI

# PRs and main pushes validate the generated package natively in the SDK repo.
# v<version> tags additionally publish the already-generated SDK to npm.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0). Defaults to the current ref.
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: install + build + pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install + build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run

  publish:
    name: npm publish
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          # Scoped packages like @liqhtworks/sophon-sdk need the scope here
          # so actions/setup-node writes the scoped registry mapping into
          # .npmrc alongside the auth token. Without it, `npm publish`
          # cannot resolve a registry for @liqhtworks and fails ENEEDAUTH.
          scope: "@liqhtworks"

      - name: Verify tag matches package.json
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          tag="${tag#refs/tags/}"
          tag="${tag#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "${tag}" != "${pkg}" ]; then
            echo "::error::tag v${tag} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      - name: Install + build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
